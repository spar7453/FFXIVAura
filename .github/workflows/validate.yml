name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}\.dalamud

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          New-Item -ItemType Directory -Force -Path $env:DALAMUD_HOME | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $env:DALAMUD_HOME -Force
          if (-not (Test-Path (Join-Path $env:DALAMUD_HOME 'Dalamud.dll'))) {
            throw 'Dalamud.dll was not found in the downloaded development package.'
          }

      - name: Restore locked dependencies
        run: dotnet restore .\FFXIVAura.csproj --locked-mode

      - name: Restore test project
        run: dotnet restore .\tests\FFXIVAura.Tests\FFXIVAura.Tests.csproj

      - name: Run tests
        run: dotnet run --project .\tests\FFXIVAura.Tests\FFXIVAura.Tests.csproj -c Release --no-restore

      - name: Build release package
        run: dotnet build .\FFXIVAura.csproj -c Release --no-restore

      - name: Verify release package
        shell: pwsh
        run: |
          $package = '.\bin\Release\FFXIVAura\latest.zip'
          if (-not (Test-Path $package)) {
            throw "Release package was not generated: $package"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packagePath = (Resolve-Path -LiteralPath $package).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @('FFXIVAura.dll', 'FFXIVAura.json', 'Data/abilities.json', 'Data/party_cooldowns.json')) {
              if ($required -notin $entries) {
                throw "Release package is missing: $required"
              }
            }
            if ($entries | Where-Object { $_ -like 'net*-windows/*' }) {
              throw 'Release package contains a stale target-framework output directory.'
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: FFXIVAura
          path: .\bin\Release\FFXIVAura\latest.zip
          if-no-files-found: error

      - name: Check deployment secret
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/kr-custom' }}
        shell: pwsh
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PLUGIN_REPO_TOKEN)) {
            throw 'PLUGIN_REPO_TOKEN repository secret is required for automatic deployment.'
          }

      - name: Check out Dalamud plugin repository
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/kr-custom' }}
        uses: actions/checkout@v7
        with:
          repository: spar7453/DalamudPlugins
          ref: main
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: plugin-repo

      - name: Publish release package to DalamudPlugins
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/kr-custom' }}
        shell: pwsh
        run: |
          $sourceManifest = Get-Content -Raw -Encoding UTF8 '.\FFXIVAura.json' | ConvertFrom-Json
          $version = $sourceManifest.AssemblyVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw 'FFXIVAura.json does not contain an AssemblyVersion.'
          }

          $sourcePackage = '.\bin\Release\FFXIVAura\latest.zip'
          $targetPackage = ".\plugin-repo\plugins\FFXIVAura\$version.zip"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $targetPackage) | Out-Null
          Copy-Item -LiteralPath $sourcePackage -Destination $targetPackage -Force

          $indexFiles = @(
            '.\plugin-repo\pluginmaster.json',
            '.\plugin-repo\repo.json',
            '.\plugin-repo\repo-0.1.0.2.json'
          )
          foreach ($indexFile in $indexFiles) {
            $content = Get-Content -Raw -Encoding UTF8 $indexFile
            $entryMatch = [regex]::Match($content, '(?ms)\{\s*"Author"\s*:\s*"spark",\s*"Name"\s*:\s*"FFXIVAura".*?(?=\r?\n\s*\},)')
            if (-not $entryMatch.Success) {
              throw "FFXIVAura entry was not found in $indexFile."
            }

            $entry = $entryMatch.Value
            $entry = [regex]::Replace($entry, '("AssemblyVersion"\s*:\s*)"[^"]+"', '${1}"' + $version + '"')
            $entry = [regex]::Replace($entry, '("DownloadLink(?:Install|Update|Testing)"\s*:\s*"https://raw\.githubusercontent\.com/spar7453/DalamudPlugins/main/plugins/FFXIVAura/)[^"]+(\.zip")', '${1}' + $version + '${2}')
            $updatedContent = $content.Substring(0, $entryMatch.Index) + $entry + $content.Substring($entryMatch.Index + $entryMatch.Length)
            [System.IO.File]::WriteAllText($indexFile, $updatedContent, [System.Text.UTF8Encoding]::new($false))
          }

          git -C .\plugin-repo config user.name 'github-actions[bot]'
          git -C .\plugin-repo config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .\plugin-repo add -- pluginmaster.json repo.json repo-0.1.0.2.json "plugins/FFXIVAura/$version.zip"
          git -C .\plugin-repo diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "DalamudPlugins is already up to date with FFXIVAura $version."
            exit 0
          }
          git -C .\plugin-repo commit -m "Update FFXIVAura to $version"
          git -C .\plugin-repo push origin main
