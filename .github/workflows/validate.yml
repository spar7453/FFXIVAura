name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}\.dalamud

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/stg/latest.zip' -OutFile $archive
          New-Item -ItemType Directory -Force -Path $env:DALAMUD_HOME | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $env:DALAMUD_HOME -Force
          if (-not (Test-Path (Join-Path $env:DALAMUD_HOME 'Dalamud.dll'))) {
            throw 'Dalamud.dll was not found in the downloaded development package.'
          }

      - name: Restore locked dependencies
        run: dotnet restore .\FFXIVAura.csproj --locked-mode

      - name: Restore test project
        run: dotnet restore .\tests\FFXIVAura.Tests\FFXIVAura.Tests.csproj

      - name: Run tests
        run: dotnet run --project .\tests\FFXIVAura.Tests\FFXIVAura.Tests.csproj -c Release --no-restore

      - name: Build release package
        run: dotnet build .\FFXIVAura.csproj -c Release --no-restore

      - name: Verify release package
        shell: pwsh
        run: |
          $package = '.\bin\Release\FFXIVAura\latest.zip'
          if (-not (Test-Path $package)) {
            throw "Release package was not generated: $package"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $packagePath = (Resolve-Path -LiteralPath $package).Path
          $archive = [System.IO.Compression.ZipFile]::OpenRead($packagePath)
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName.Replace('\', '/') })
            foreach ($required in @('FFXIVAura.dll', 'FFXIVAura.json', 'Data/abilities.json', 'Data/party_cooldowns.json')) {
              if ($required -notin $entries) {
                throw "Release package is missing: $required"
              }
            }
            if ($entries | Where-Object { $_ -like 'net*-windows/*' }) {
              throw 'Release package contains a stale target-framework output directory.'
            }
          }
          finally {
            $archive.Dispose()
          }

      - name: Upload release package
        uses: actions/upload-artifact@v7
        with:
          name: FFXIVAura
          path: .\bin\Release\FFXIVAura\latest.zip
          if-no-files-found: error
